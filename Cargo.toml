[workspace]
members = ["crates/*"]

[package]
name = "tetrust"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tetrust-engine = { path = "crates/tetrust-engine" }
js-sys = "0.3.55"
wasm-bindgen = "0.2.83"
wasm-logger = "0.2.0"
log = "0.4.14"
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3.70"
features = [
  'CanvasRenderingContext2d',
  'Document',
  'Element',
  'Event',
  'EventTarget',
  'HtmlCanvasElement',
  'HtmlInputElement',
  'KeyboardEvent',
  'Node',
  'Performance',
  'Storage',
  'Window',
]
