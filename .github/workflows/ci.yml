name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: fmt
        run: cargo fmt -p tetrust-engine --check
      - name: clippy
        run: cargo clippy -p tetrust-engine --all-targets -- -D warnings
      - name: test
        run: cargo test -p tetrust-engine
      - name: wasm build
        run: cargo build --workspace --target wasm32-unknown-unknown
